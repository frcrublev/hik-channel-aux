<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,500;0,600;1,400&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap">
<style>
:root{
  --ground:#f1f2f3; --paper:#ffffff; --raised:#f7f8f9;
  --ink:#1f2124; --ink-2:#5e6167; --ink-3:#8d9096;
  --line:#e5e7ea; --line-2:#d2d5da; --tint:rgba(31,33,36,.055);
  --red:#c8102e; --red-2:#a20d25; --red-soft:#fbe9ec; --red-mid:#f0cdd3;
  --on-red:#ffffff; --on-red-2:rgba(255,255,255,.78);
  --amber:#8f6013; --amber-soft:#f7efdf;
  --shadow:0 1px 2px rgba(20,22,25,.05),0 10px 28px -22px rgba(20,22,25,.5);
  --shadow-lift:0 4px 12px rgba(20,22,25,.1),0 24px 48px -24px rgba(20,22,25,.6);
  --ease:cubic-bezier(.22,.68,.36,1);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#151618; --paper:#1e2023; --raised:#26282c;
    --ink:#eceef1; --ink-2:#a8acb3; --ink-3:#7e828a;
    --line:#31343a; --line-2:#43474e; --tint:rgba(255,255,255,.06);
    --red:#e8455c; --red-2:#ff6b7e; --red-soft:#3a1d23; --red-mid:#54282f;
    --amber:#d9a55c; --amber-soft:#332818;
    --shadow:0 1px 2px rgba(0,0,0,.45),0 12px 30px -24px #000;
    --shadow-lift:0 6px 18px rgba(0,0,0,.55),0 30px 60px -28px #000;
  }
}
:root[data-theme="dark"]{
  --ground:#151618; --paper:#1e2023; --raised:#26282c;
  --ink:#eceef1; --ink-2:#a8acb3; --ink-3:#7e828a;
  --line:#31343a; --line-2:#43474e; --tint:rgba(255,255,255,.06);
  --red:#e8455c; --red-2:#ff6b7e; --red-soft:#3a1d23; --red-mid:#54282f;
  --amber:#d9a55c; --amber-soft:#332818;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 12px 30px -24px #000;
  --shadow-lift:0 6px 18px rgba(0,0,0,.55),0 30px 60px -28px #000;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:"Source Sans 3","Microsoft YaHei","PingFang SC",system-ui,sans-serif;font-size:15px;line-height:1.5}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:5px}

/* ---------- banner ---------- */
.banner{background:var(--red);color:var(--on-red)}
.in{max-width:1400px;margin:0 auto;padding:0 24px}
.banner .in{padding-top:14px;padding-bottom:20px}
.idbar{display:flex;justify-content:flex-end;gap:8px;margin-bottom:10px}
.idbar button{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.42);
  color:var(--on-red);font-weight:600;border-radius:8px;padding:5px 11px;font-size:13.5px;cursor:pointer;
  font-family:inherit;transition:background .16s var(--ease)}
.idbar button:hover{background:rgba(255,255,255,.3)}
.idbar button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.titles{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 26px}
h1{font-family:"Source Serif 4",Georgia,"Songti SC",serif;font-weight:600;font-size:25px;margin:0}
.sub{color:var(--on-red-2);font-size:13px;margin-top:3px}
.count{display:inline-flex;align-items:center;gap:7px;margin-top:10px;font-size:13px;
  background:rgba(255,255,255,.17);border-radius:99px;padding:3px 13px;font-weight:600}
.count i{width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 2.4s var(--ease) infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
.tally{margin-left:auto;display:flex;gap:22px}
.tally div{text-align:right}
.tally b{display:block;font-size:21px;font-weight:600;line-height:1.15}
.tally span{font-size:11.5px;color:var(--on-red-2)}
.tally .todo b{color:#ffd9a0}

/* ---------- toolbar ---------- */
.tools{background:var(--raised);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;
  transition:box-shadow .25s var(--ease)}
.tools.stuck{box-shadow:0 6px 18px -14px rgba(20,22,25,.55)}
.tools .in{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 24px}
input,select,button{font:inherit;font-size:13.5px;color:var(--ink);background:var(--paper);
  border:1px solid var(--line-2);border-radius:8px;padding:5px 11px}
input::placeholder{color:var(--ink-3)}
button{cursor:pointer;transition:background .16s var(--ease),border-color .16s var(--ease),transform .12s var(--ease)}
button:hover{border-color:var(--ink-3)}
button:active{transform:scale(.97)}
button.key{background:var(--red);border-color:var(--red);color:#fff;font-weight:500}
button.key:hover{background:var(--red-2);border-color:var(--red-2)}
.grow{flex:1}

/* ---------- calendar ---------- */
.wrap{max-width:1400px;margin:0 auto;padding:18px 24px 70px}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:12px;font-size:12px;color:var(--ink-3)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.key-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.kd-Confirmed{background:var(--red)} .kd-Pending{background:var(--amber)}
.kd-Tentative{background:var(--line-2)} .kd-Cancelled{background:transparent;box-shadow:inset 0 0 0 1px var(--ink-3)}

.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.wdh{background:var(--red);color:var(--on-red);font-size:12px;font-weight:600;letter-spacing:.06em;
  text-align:center;padding:9px 4px;text-transform:uppercase}
.wdh.we{background:var(--red-2)}
.cell{background:var(--paper);min-height:132px;padding:8px 8px 6px;display:flex;flex-direction:column;gap:5px}
.cell.out{background:var(--raised)}
.cell.we{background:var(--raised)}
.cell.today{box-shadow:inset 0 0 0 2px var(--red)}
.cell:hover .add{opacity:1}
.dnum{display:flex;align-items:baseline;gap:6px;font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.dnum b{font-family:"Source Serif 4",Georgia,serif;font-size:17px;color:var(--ink);font-weight:600}
.cell.out .dnum b{color:var(--ink-3)}
.cell.today .dnum b{color:var(--red)}
.dnum .mo{font-size:11px;letter-spacing:.05em}

.ev{display:block;width:100%;text-align:left;border:1px solid var(--line);border-left:3px solid var(--red);
  background:var(--paper);border-radius:7px;padding:5px 8px;font-size:12.5px;line-height:1.35;
  transition:transform .14s var(--ease),box-shadow .14s var(--ease),border-color .14s}
.ev:hover{transform:translateY(-1px);box-shadow:var(--shadow);border-color:var(--line-2)}
.ev.internal{border-left-color:var(--ink-3)}
.ev.ND{border-left-color:var(--amber)}
.ev.other{border-left-color:var(--line-2)}
.ev .tm{color:var(--ink-3);font-variant-numeric:tabular-nums;font-size:11.5px}
.ev .nm{display:block;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev .tp{display:block;color:var(--ink-2);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev .dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:1px}
.ev.off{opacity:.5}
.ev.off .nm{text-decoration:line-through}
.ev.fresh{animation:fresh 1.6s var(--ease)}
@keyframes fresh{0%{background:var(--amber-soft)}100%{background:var(--paper)}}
.add{margin-top:auto;border:1px dashed var(--line-2);background:none;color:var(--ink-3);border-radius:7px;
  padding:3px 8px;font-size:12px;opacity:0;transition:opacity .16s var(--ease),color .16s,border-color .16s}
.add:hover{color:var(--red);border-color:var(--red)}
.warnday{font-size:11.5px;color:var(--amber);display:flex;gap:5px;line-height:1.3}

/* ---------- detail sheet ---------- */
.veil{position:fixed;inset:0;background:rgba(20,22,25,.42);opacity:0;pointer-events:none;z-index:30;
  transition:opacity .2s var(--ease)}
.veil.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:31;right:0;top:0;bottom:0;width:min(440px,100%);background:var(--paper);
  box-shadow:var(--shadow-lift);transform:translateX(101%);transition:transform .26s var(--ease);
  display:flex;flex-direction:column}
.sheet.on{transform:none}
.shead{background:var(--red);color:var(--on-red);padding:16px 20px;display:flex;align-items:flex-start;gap:12px}
.shead h2{margin:0;font-family:"Source Serif 4",Georgia,serif;font-size:19px;font-weight:600}
.shead .sd{font-size:12.5px;color:var(--on-red-2);margin-top:2px}
.shead button{margin-left:auto;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);
  color:#fff;border-radius:7px;width:30px;height:30px;padding:0;font-size:17px;line-height:1;flex:none}
.sbody{padding:16px 20px 22px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.fld label{display:block;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);
  font-weight:600;margin-bottom:4px}
.fld .val{border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-height:36px;background:var(--paper);
  transition:border-color .15s var(--ease),background .15s}
.fld .val:hover{background:var(--tint)}
.fld .val:focus{outline:none;border-color:var(--red);background:var(--paper);box-shadow:0 0 0 3px var(--red-soft)}
.fld .val.empty{color:var(--ink-3);font-style:italic}
.fld.big .val{font-size:16px;font-weight:600}
.win{display:flex;align-items:center;gap:8px}
.win input[type=time]{flex:1;font-variant-numeric:tabular-nums}
.dur{font-size:12px;color:var(--ink-3);margin-top:5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border-radius:99px;font-size:12.5px;padding:4px 12px;font-weight:600;color:var(--ink-2);
  background:var(--paper);border:1px solid var(--line-2)}
.chips button[aria-pressed=true]{background:var(--red);border-color:var(--red);color:#fff}
.chips.st button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.maprow{display:flex;gap:8px;align-items:center;margin-top:7px}
.maprow a{font-size:12.5px;color:var(--red);text-decoration:none;font-weight:600;
  border:1px solid var(--red-mid);border-radius:7px;padding:4px 10px;transition:background .15s}
.maprow a:hover{background:var(--red-soft)}
.sfoot{margin-top:auto;padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;
  background:var(--raised)}
.sig{font-size:11.5px;color:var(--ink-3)}
.sig b{color:var(--ink-2)}
.del{color:var(--red);border-color:var(--red-mid);margin-left:auto}
.del:hover{background:var(--red-soft);border-color:var(--red)}

.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,18px);background:var(--red);color:#fff;
  font-size:13.5px;padding:8px 18px;border-radius:99px;opacity:0;pointer-events:none;z-index:40;
  transition:opacity .25s var(--ease),transform .25s var(--ease);box-shadow:var(--shadow-lift)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.foot{color:var(--ink-3);font-size:12.5px;max-width:76ch;margin-top:20px;line-height:1.65}

@media (max-width:860px){
  .cal{grid-template-columns:1fr;border-radius:10px}
  .wdh{display:none}
  .cell{min-height:0}
  .cell.out{display:none}
  .dnum{border-bottom:1px solid var(--line);padding-bottom:5px}
  .add{opacity:1}
  .tally{margin-left:0;width:100%;justify-content:space-between;gap:8px}
  .tally div{text-align:left}
  .sheet{width:100%}
}
@media print{
  .tools,.idbar,.add,.toast,.foot,.veil,.sheet,.legend{display:none!important}
  body{background:#fff}
  .banner,.wdh{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .cal{box-shadow:none}
  .cell{min-height:120px}
}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}
  .add{opacity:1}}
</style>

 {date:"2026-09-28",start:"",end:"",type:"other",customer:"Security Market",people:"Francis Fang + Raquel Jiang",status:"Tentative",addr:"",city:"",topic:"",notes:"地址待核实"},

 {date:"2026-09-29",start:"",end:"",type:"other",customer:"Pending",people:"Francis Fang + Raquel Jiang",status:"Tentative",addr:"",city:"",topic:"",notes:"客户待定"},

 {date:"2026-10-02",start:"",end:"",type:"ND",customer:"Hik Arg Team",people:"León Fu",status:"Tentative",addr:"",city:"",topic:"内部总结",notes:""}
];

const FROM="2026-09-14", TO="2026-10-02";
const STATUS=["Confirmed","Pending","Tentative","Cancelled"];
const TYPES=["DPP","internal","ND","other"];
const KEY="visit-20260914-1002-MKT-EasonHuang-v5";
const LKEY="visit-agenda-lang", WKEY="visit-agenda-who";
const CALM=matchMedia("(prefers-reduced-motion: reduce)").matches;

let lang=(function(){try{return localStorage.getItem(LKEY)==="es"?"es":"zh"}catch(e){return "zh"}})();
let t=T[lang];
let me=(function(){try{return localStorage.getItem(WKEY)||""}catch(e){return ""}})();

const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const dt=x=>new Date(x+"T12:00:00");
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const mins=s=>/^\d{2}:\d{2}$/.test(s||"")?(+s.slice(0,2))*60+(+s.slice(3)):null;
const hrs=(a,b)=>{const x=mins(a),y=mins(b);return x!=null&&y!=null&&y>x?Math.round((y-x)/6)/10:null};
const wdIdx=x=>(dt(x).getDay()+6)%7;
const fmtDate=x=>{const d=dt(x);return lang==="es"
  ?String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear()
  :d.getFullYear()+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+String(d.getDate()).padStart(2,"0")};
const shortAt=s=>{if(!s)return "";const d=new Date(s);if(isNaN(d))return "";
  const p=n=>String(n).padStart(2,"0");return p(d.getMonth()+1)+"/"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes())};

let rows;
try{rows=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!Array.isArray(rows)||!rows.length)rows=clone(SEED);
rows.forEach(r=>{if(!r.uid)r.uid="r"+Math.random().toString(36).slice(2,9)});
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(rows))}catch(e){}};
const stamp=r=>{r.by=me||"?";r.at=new Date().toISOString()};
const touched=new Set();
let openUid=null;

let toastT;
function toast(m){
  const el=document.getElementById("toast");
  el.textContent=m;el.classList.add("show");
  clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove("show"),2000);
}
function askWho(){
  const n=prompt(t.askWho,me||"");
  if(n===null)return false;
  me=n.trim().slice(0,24);
  try{localStorage.setItem(WKEY,me)}catch(e){}
  paintWho();return true;
}
function paintWho(){document.getElementById("who").textContent=me?t.whoIs(me):t.whoSet}

function chrome(){
  document.documentElement.lang=lang==="es"?"es":"zh-CN";
  document.title=t.title+" · Eason Huang";
  document.getElementById("h1").textContent=t.title;
  document.getElementById("sub").textContent=t.sub;
  document.getElementById("q").placeholder=t.search;
  document.getElementById("lang").textContent=t.lang;
  document.getElementById("send").textContent=t.send;
  document.getElementById("merge").textContent=t.merge;
  document.getElementById("csv").textContent=t.csv;
  document.getElementById("reset").textContent=t.reset;
  document.getElementById("prt").textContent=t.print;
  document.getElementById("shDel").textContent=t.del;
  document.getElementById("shClose").title=t.close;
  document.getElementById("foot").textContent=t.foot;
  document.getElementById("legend").innerHTML=STATUS.map(s=>
    '<span><i class="key-dot kd-'+s+'"></i>'+esc(t.status[s])+"</span>").join("");
  paintWho();
  const today=new Date();today.setHours(12,0,0,0);
  const a=dt(FROM),b=dt(TO),day=864e5;
  document.getElementById("countTxt").textContent=
    today<a?t.before(Math.round((a-today)/day)):(today<=b?t.during(Math.round((today-a)/day)+1):t.after);
  document.getElementById("count").hidden=false;
}

const shown={};
function countTo(el,to,k){
  const from=shown[k]||0;shown[k]=to;
  if(CALM||from===to){el.textContent=to;return}
  const t0=performance.now();
  (function step(now){
    const p=Math.min(1,(now-t0)/500),e=1-Math.pow(1-p,3);
    el.textContent=Math.round(from+(to-from)*e);
    if(p<1)requestAnimationFrame(step);
  })(t0);
}
function fill(id,vals,label){
  const el=document.getElementById(id),cur=el.value;
  el.innerHTML='<option value="">'+esc(label)+"</option>"
    +vals.map(v=>'<option value="'+esc(v[0])+'">'+esc(v[1])+"</option>").join("");
  el.value=vals.some(v=>v[0]===cur)?cur:"";
}
function match(r){
  const q=document.getElementById("q").value.trim().toLowerCase();
  const ty=document.getElementById("fType").value,st=document.getElementById("fStatus").value;
  if(ty&&r.type!==ty)return false;
  if(st&&r.status!==st)return false;
  if(q&&![r.customer,r.addr,r.city,r.topic,r.notes,r.people].join(" ").toLowerCase().includes(q))return false;
  return true;
}
function gridDays(){
  const out=[];
  const s=dt(FROM);s.setDate(s.getDate()-wdIdx(FROM));
  const e=dt(TO);e.setDate(e.getDate()+(6-wdIdx(TO)));
  for(let d=new Date(s);d<=e;d.setDate(d.getDate()+1))out.push(iso(d));
  return out;
}
function dayRows(x){
  return rows.filter(r=>r.date===x)
    .sort((a,b)=>(mins(a.start)==null?1e9:mins(a.start))-(mins(b.start)==null?1e9:mins(b.start)));
}

function render(){
  fill("fType",TYPES.map(x=>[x,t.type[x]]),t.allType);
  fill("fStatus",STATUS.map(x=>[x,t.status[x]]),t.allStatus);

  const live=rows.filter(r=>r.status!=="Cancelled");
  const trip=[];for(let d=dt(FROM);d<=dt(TO);d.setDate(d.getDate()+1))trip.push(iso(d));
  const busy={};live.forEach(r=>busy[r.date]=(busy[r.date]||0)+1);
  const tal=[live.length,new Set(live.filter(r=>r.type==="DPP").map(r=>r.customer)).size,
    live.filter(r=>r.status==="Confirmed").length,
    live.filter(r=>["Pending","Tentative"].includes(r.status)).length,
    trip.filter(d=>!busy[d]).length];
  const cls=["","","","todo",""];
  const tEl=document.getElementById("tally");
  tEl.innerHTML=tal.map((v,i)=>'<div class="'+cls[i]+'"><b>'+(shown[i]||0)+"</b><span>"+esc(t.tally[i])+"</span></div>").join("");
  tal.forEach((v,i)=>countTo(tEl.children[i].querySelector("b"),v,i));

  const today=iso(new Date());
  let html=t.wd.map((w,i)=>'<div class="wdh'+(i>4?" we":"")+'">'+esc(w)+"</div>").join("");
  html+=gridDays().map(x=>{
    const out=x<FROM||x>TO, we=wdIdx(x)>4, d=dt(x);
    const list=dayRows(x);
    let prev=null,clash=false;
    const evs=list.map(r=>{
      const s=mins(r.start);
      if(s!=null&&prev!=null&&s<prev&&r.status!=="Cancelled")clash=true;
      const e=mins(r.end);if(e!=null)prev=e;else if(s!=null)prev=s;
      if(!match(r))return "";
      const when=r.start?(r.start+(r.end?"–"+r.end:"")):t.tbd;
      const line2=r.topic||r.city||r.people;
      return '<button class="ev '+r.type+(r.status==="Cancelled"?" off":"")
        +(touched.has(r.uid)?" fresh":"")+'" data-open="'+r.uid+'">'
        +'<span class="tm"><i class="dot kd-'+r.status+'"></i>'+esc(when)+"</span>"
        +'<span class="nm">'+esc(r.customer||t.phCustomer)+"</span>"
        +(line2?'<span class="tp">'+esc(line2)+"</span>":"")+"</button>";
    }).join("");
    return '<div class="cell'+(out?" out":"")+(we?" we":"")+(x===today?" today":"")+'">'
      +'<div class="dnum"><b>'+d.getDate()+'</b><span class="mo">'
      +String(d.getMonth()+1).padStart(2,"0")+(lang==="es"?"":"月")+"</span></div>"
      +evs
      +(clash?'<div class="warnday"><span>⚑</span><span>'+esc(t.clash)+"</span></div>":"")
      +(out?"":'<button class="add" data-new="'+x+'">'+esc(t.add)+"</button>")
      +"</div>";
  }).join("");
  document.getElementById("cal").innerHTML=html;
  if(openUid)paintSheet();
}

function field(k,label,ph,big){
  const r=rows.find(x=>x.uid===openUid), v=r[k];
  return '<div class="fld'+(big?" big":"")+'"><label>'+esc(label)+"</label>"
    +'<div class="val'+(v?"":" empty")+'" contenteditable data-k="'+k+'">'+esc(v||ph)+"</div></div>";
}
function paintSheet(){
  const r=rows.find(x=>x.uid===openUid);
  if(!r){closeSheet();return}
  document.getElementById("shTitle").textContent=r.customer||t.phCustomer;
  document.getElementById("shDate").textContent=fmtDate(r.date)+" · "+t.wd[wdIdx(r.date)];
  const h=hrs(r.start,r.end);
  const q=(r.addr||"").trim()?[r.addr,r.city,"Argentina"].filter(Boolean).join(", ")
    :[r.customer,r.city,"Argentina"].filter(Boolean).join(", ");
  const href="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q);
  document.getElementById("shBody").innerHTML=
     '<div class="fld"><label>'+esc(t.fTime)+"</label>"
    +'<div class="win"><input type="time" value="'+esc(r.start)+'" data-time="start">'
    +'<span>–</span><input type="time" value="'+esc(r.end)+'" data-time="end"></div>'
    +'<div class="dur">'+esc(h!=null?t.hrs(h):t.tbd)+"</div></div>"
    +field("customer",t.fCustomer,t.phCustomer,true)
    +field("topic",t.fTopic,t.phTopic,true)
    +field("people",t.fPeople,t.phPeople)
    +'<div class="fld"><label>'+esc(t.fAddr)+"</label>"
    +'<div class="val'+(r.addr?"":" empty")+'" contenteditable data-k="addr">'+esc(r.addr||t.phAddr)+"</div>"
    +'<div class="maprow"><a href="'+href+'" target="_blank" rel="noopener noreferrer">📍 '
    +esc(r.addr?t.map:t.mapGuess)+"</a></div></div>"
    +field("city",t.fCity,t.phCity)
    +'<div class="fld"><label>'+esc(t.fType)+'</label><div class="chips">'
    +TYPES.map(x=>'<button data-set-type="'+x+'" aria-pressed="'+(r.type===x)+'">'+esc(t.type[x])+"</button>").join("")
    +"</div></div>"
    +'<div class="fld"><label>'+esc(t.fStatus)+'</label><div class="chips st">'
    +STATUS.map(x=>'<button data-set-status="'+x+'" aria-pressed="'+(r.status===x)+'">'+esc(t.status[x])+"</button>").join("")
    +"</div></div>"
    +field("notes",t.fNote,t.phNote);
  document.getElementById("shSig").innerHTML=r.by?"<b>"+esc(r.by)+"</b> · "+esc(shortAt(r.at)):esc(t.never);
}
function openSheet(uid){
  openUid=uid;paintSheet();
  document.getElementById("sheet").classList.add("on");
  document.getElementById("veil").classList.add("on");
}
function closeSheet(){
  openUid=null;
  document.getElementById("sheet").classList.remove("on");
  document.getElementById("veil").classList.remove("on");
}
function addOn(date){
  const uid="r"+Math.random().toString(36).slice(2,9);
  const nr={uid:uid,date:date,start:"",end:"",type:"DPP",customer:t.newCustomer,
    people:me||"Francis Fang",status:"Pending",addr:"",city:"",topic:"",notes:""};
  stamp(nr);rows.push(nr);save();render();openSheet(uid);
  const el=document.querySelector('#shBody [data-k="customer"]');
  if(el){el.focus();getSelection().selectAllChildren(el)}
}

document.addEventListener("input",e=>{
  const tm=e.target.closest("input[type=time]");
  if(tm&&openUid){
    const r=rows.find(x=>x.uid===openUid);
    r[tm.dataset.time]=tm.value;
    if(tm.dataset.time==="start"&&r.start&&!r.end){
      const m=mins(r.start);
      if(m!=null)r.end=String(Math.min(21,Math.floor(m/60)+1)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
    }
    stamp(r);
    clearTimeout(window.__t);window.__t=setTimeout(()=>{save();render()},450);
    return;
  }
  const ed=e.target.closest("[contenteditable][data-k]");
  if(ed&&openUid){
    const r=rows.find(x=>x.uid===openUid);
    r[ed.dataset.k]=ed.textContent.trim();stamp(r);
    if(ed.dataset.k==="customer")document.getElementById("shTitle").textContent=r.customer||t.phCustomer;
    clearTimeout(window.__t);window.__t=setTimeout(()=>{save();render()},450);
  }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&openUid)closeSheet();
  if(e.target.isContentEditable&&e.key==="Enter"){e.preventDefault();e.target.blur()}
});
document.addEventListener("click",e=>{
  const o=e.target.closest("[data-open]");
  if(o){openSheet(o.dataset.open);return}
  const n=e.target.closest("[data-new]");
  if(n){addOn(n.dataset.new);return}
  const ty=e.target.closest("[data-set-type]");
  if(ty&&openUid){const r=rows.find(x=>x.uid===openUid);r.type=ty.dataset.setType;stamp(r);save();render();return}
  const st=e.target.closest("[data-set-status]");
  if(st&&openUid){const r=rows.find(x=>x.uid===openUid);r.status=st.dataset.setStatus;stamp(r);save();render();return}
});
document.getElementById("veil").onclick=closeSheet;
document.getElementById("shClose").onclick=closeSheet;
document.getElementById("shDel").onclick=()=>{
  const r=rows.find(x=>x.uid===openUid);if(!r)return;
  if(!confirm(t.askDel(r.customer||t.thisOne)))return;
  rows.splice(rows.indexOf(r),1);closeSheet();save();render();toast(t.removed);
};
["q","fType","fStatus"].forEach(id=>document.getElementById(id).addEventListener("input",render));
document.getElementById("who").onclick=()=>askWho();
document.getElementById("lang").onclick=()=>{
  lang=lang==="zh"?"es":"zh";t=T[lang];
  try{localStorage.setItem(LKEY,lang)}catch(e){}
  chrome();render();toast(lang==="es"?"Español":"中文");
};
document.getElementById("reset").onclick=()=>{
  if(!confirm(t.askReset))return;
  rows=clone(SEED);rows.forEach(r=>r.uid="r"+Math.random().toString(36).slice(2,9));
  touched.clear();closeSheet();save();render();toast(t.restored);
};
document.getElementById("prt").onclick=()=>print();
document.getElementById("send").onclick=()=>{
  if(!me&&!askWho())return;
  const pack={app:"hik-visit-agenda",ref:"20260914-1002-MKT-Eason Huang",v:1,by:me,at:new Date().toISOString(),rows:rows};
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify(pack,null,1)],{type:"application/json"}));
  a.download="agenda-"+(me||"edit").replace(/[^\w一-龥-]/g,"")+"-"+new Date().toISOString().slice(0,10)+".json";
  a.click();toast(t.sent);
};
document.getElementById("merge").onclick=()=>document.getElementById("file").click();
document.getElementById("file").onchange=e=>{
  const f=e.target.files&&e.target.files[0];e.target.value="";
  if(!f)return;
  const fr=new FileReader();
  fr.onload=()=>{
    let pack;try{pack=JSON.parse(fr.result)}catch(err){alert(t.badFile);return}
    if(!pack||pack.app!=="hik-visit-agenda"||!Array.isArray(pack.rows)){alert(t.badFile);return}
    const byUid={};rows.forEach(r=>byUid[r.uid]=r);
    let add=0,upd=0,keep=0;const hit=[];
    pack.rows.forEach(inc=>{
      if(!inc||!inc.uid)return;
      const cur=byUid[inc.uid];
      if(!cur){add++;hit.push(inc);return}
      const a=Date.parse(inc.at||"")||0,b=Date.parse(cur.at||"")||0;
      if(a>b&&JSON.stringify(inc)!==JSON.stringify(cur)){upd++;hit.push(inc)}else keep++;
    });
    if(!add&&!upd){toast(t.nothing);return}
    if(!confirm(t.mergeAsk(add,upd,keep)))return;
    touched.clear();
    hit.forEach(inc=>{
      const cur=byUid[inc.uid];
      if(cur)Object.assign(cur,inc);else rows.push(inc);
      touched.add(inc.uid);
    });
    save();render();toast(t.merged(add,upd));
  };
  fr.readAsText(f);
};
document.getElementById("csv").onclick=()=>{
  const q=s=>'"'+String(s==null?"":s).replace(/"/g,'""')+'"';
  const body=rows.slice().sort((a,b)=>(a.date+(a.start||"zz")).localeCompare(b.date+(b.start||"zz")))
    .map(r=>[r.date,t.wd[wdIdx(r.date)],r.start,r.end,hrs(r.start,r.end)||"",t.type[r.type],r.customer,
      r.people,r.topic,t.status[r.status],r.addr,r.city,r.notes,r.by||"",shortAt(r.at)].map(q).join(","));
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob(["﻿"+[t.csvHead.join(",")].concat(body).join("\r\n")],{type:"text/csv;charset=utf-8"}));
  a.download="20260914-1002-MKT-Eason Huang.csv";a.click();toast(t.csvDone);
};
addEventListener("scroll",()=>{
  document.getElementById("tools").classList.toggle("stuck",scrollY>4);
},{passive:true});

chrome();
render();
